# Comprehensive list of acts of Congress that created or amended US copyright law
# Each entry represents one commit in this repository's history
#
# Status key:
#   done     = committed to this repo
#   pending  = not yet committed
#
# Sources: Copyright Office timeline, Copyright Office legislation page,
#          Congressional Research Service, Statutes at Large, Public Law records,
#          OLRC section-by-section amendment notes for all sections of Title 17

# =============================================================================
# PRE-1976 ERA
# =============================================================================

- name: Copyright Act of 1790
  date: 1790-05-31
  citation: 1 Stat. 124
  chapter: Ch. 15
  summary: >
    First federal copyright law. Protected books, maps, and charts for 14 years
    with a 14-year renewal term. Required registration in the local district court
    and deposit of a copy with the Secretary of State.
  tag: v1790
  status: pending

- name: Copyright Act Amendment of 1802
  date: 1802-04-29
  citation: 2 Stat. 171
  chapter: Ch. 36
  summary: >
    Extended protection to historical and other prints. Required copyright notice
    to be inserted in the title page or the page immediately following.
  status: pending

- name: Copyright Act of 1831
  date: 1831-02-03
  citation: 4 Stat. 436
  chapter: Ch. 16
  summary: >
    First general revision. Added musical compositions to protected works.
    Extended initial term to 28 years with a 14-year renewal term.
    Granted rights to widows and children of deceased authors.
  tag: v1831
  status: pending

- name: Copyright Assignment Recordation Act of 1834
  date: 1834-06-30
  citation: 4 Stat. 728
  chapter: Ch. 157
  summary: >
    Amended the copyright act to permit, for the first time, recordation of
    assignments of copyright. Required assignments to be recorded with the
    clerk of the district court within sixty days.
  status: pending

- name: Copyright Amendment of 1856
  date: 1856-08-18
  citation: 11 Stat. 138
  chapter: Ch. 169
  summary: >
    Extended copyright protection to dramatic compositions, including the
    exclusive right of public performance.
  status: pending

- name: Copyright Amendment of 1865
  date: 1865-03-03
  citation: 13 Stat. 540
  chapter: Ch. 126
  summary: >
    Extended copyright protection to photographs and photographic negatives.
  status: pending

- name: Copyright Act of 1870
  date: 1870-07-08
  citation: 16 Stat. 198, 212
  chapter: Ch. 230
  summary: >
    Second general revision. Centralized all copyright activities at the
    Library of Congress. Extended protection to paintings, drawings, chromos,
    statues, statuary, and models or designs intended to be perfected as works
    of the fine arts. Also covered translations and dramatizations.
  tag: v1870
  status: pending

- name: Copyright Notice Amendment of 1874
  date: 1874-06-18
  citation: 18 Stat. 78
  chapter: Ch. 301
  summary: >
    Revised copyright notice requirements and transferred registration of
    commercial prints and labels to the Patent Office.
  status: pending

- name: Post Office Appropriations Act of 1879 (Copyright Mailing Provision)
  date: 1879-03-03
  citation: 20 Stat. 355
  chapter: Ch. 180
  summary: >
    Made it illegal to mail infringing copies of copyrighted works through
    the US postal system.
  status: pending

- name: Copyright Notice Amendment of 1882
  date: 1882-08-01
  citation: 22 Stat. 181
  chapter: Ch. 366
  summary: >
    Allowed copyright notices on designs for useful articles to be placed
    on the back or bottom rather than the front of the article.
  status: pending

- name: International Copyright Act of 1891 (Chace Act)
  date: 1891-03-03
  citation: 26 Stat. 1106
  chapter: Ch. 565
  summary: >
    Authorized establishment of copyright relations with foreign nations.
    Required manufacturing clause (works must be printed in the US).
    First time foreign authors could obtain US copyright protection.
  status: pending

- name: Printing Act of 1895
  date: 1895-01-12
  citation: 28 Stat. 601
  chapter: Ch. 23
  summary: >
    Prohibited copyright in publications of the United States government.
    Centralized government printing operations.
  status: pending

- name: Copyright Amendment of 1897 (Musical Performance)
  date: 1897-01-06
  citation: 29 Stat. 481
  chapter: Ch. 4
  summary: >
    Made unauthorized public performance of musical compositions a
    misdemeanor punishable by imprisonment.
  status: pending

- name: Copyright Office Establishment Act of 1897
  date: 1897-02-19
  citation: 29 Stat. 544
  chapter: Ch. 265
  summary: >
    Established the Copyright Office as a separate department within the
    Library of Congress and created the position of Register of Copyrights.
  status: pending

- name: Ad Interim Copyright Act of 1904
  date: 1904-01-07
  citation: 33 Stat. 4
  chapter: Ch. 2
  summary: >
    Provided temporary (two-year) copyright protection specifically for
    foreign exhibitors at the Louisiana Purchase Exposition in St. Louis,
    without requiring compliance with the manufacturing clause.
  status: pending

- name: Ad Interim Copyright Amendment of 1905
  date: 1905-03-03
  citation: 33 Stat. 1000
  chapter: Ch. 1432
  summary: >
    Amended ad interim copyright provisions to satisfy treaty obligations
    with France and Germany regarding copyright protection of foreign works.
  status: pending

- name: Copyright Act of 1909
  date: 1909-03-04
  citation: 35 Stat. 1075
  public_law: Pub. L. 60-349
  summary: >
    Third general revision and first comprehensive copyright statute of the
    20th century. Granted federal statutory protection to all writings of an
    author upon publication with notice, while preserving state common law
    protection for unpublished works. Introduced the mechanical license
    for musical recordings. Required published copies to bear copyright notice.
    Extended renewal term to 28 years (28+28 = 56 years total).
  tag: v1909
  status: pending

- name: Copyright Amendment of 1912 (Townsend Amendment - Motion Pictures)
  date: 1912-08-24
  citation: 37 Stat. 488
  chapter: Ch. 356
  summary: >
    Extended copyright protection to motion pictures as a distinct category.
    Previously, motion pictures were registered as series of still photographs.
  status: pending

- name: Copyright Deposit Amendment of 1914
  date: 1914-03-28
  citation: 38 Stat. 311
  chapter: Ch. 47
  summary: >
    Amended Section 12 of the 1909 Act to allow foreign authors to deposit
    only one copy of the best edition (instead of two) for copyright registration.
  status: pending

- name: Prints and Labels Transfer Act of 1939
  date: 1939-07-31
  citation: 53 Stat. 1142
  chapter: Ch. 396
  summary: >
    Transferred registration of prints and labels from the Patent Office
    to the Copyright Office, effective July 1, 1940.
  status: pending

- name: Emergency Copyright Act of 1941
  date: 1941-09-25
  citation: 55 Stat. 732
  chapter: Ch. 421
  summary: >
    Extended time periods for completing copyright formalities to account for
    wartime disruptions of communications and transportation facilities
    during World War II.
  status: pending

- name: Copyright Law Codification Act of 1947
  date: 1947-07-30
  citation: 61 Stat. 652
  chapter: Ch. 391
  summary: >
    Codified copyright law as Title 17 of the United States Code.
    Substantive provisions remained those of the 1909 Act as amended.
  status: pending

- name: Copyright Statute of Limitations Act of 1957
  date: 1957-09-07
  citation: 71 Stat. 633
  public_law: Pub. L. 85-313
  summary: >
    Established a uniform three-year statute of limitations for civil
    copyright infringement actions (Section 507) and a three-year limitation
    for criminal proceedings, replacing the prior practice of borrowing
    varying state statutes of limitations.
  status: pending

# Nine successive interim extension acts (1962-1974) extended renewal terms
# for works whose copyrights would otherwise expire while Congress worked on
# the general revision that became the 1976 Act.

- name: First Copyright Term Extension Act of 1962
  date: 1962-09-19
  citation: 76 Stat. 555
  public_law: Pub. L. 87-668
  summary: >
    First of nine interim extension acts. Extended renewal terms of copyrights
    that would otherwise expire, while Congress considered general revision
    of the copyright law.
  status: pending

- name: Second Copyright Term Extension Act of 1965
  date: 1965-08-28
  citation: 79 Stat. 581
  public_law: Pub. L. 89-142
  summary: >
    Second interim extension of copyright renewal terms pending general revision.
  status: pending

- name: Government Organization and Employees Act of 1966 (Copyright Provision)
  date: 1966-09-06
  citation: 80 Stat. 378
  public_law: Pub. L. 89-554
  summary: >
    Repealed and re-enacted the Administrative Procedure Act as part of
    Title 5. Updated cross-references in Section 701 of Title 17 (Copyright
    Office) to reflect the new codification of APA provisions.
  status: pending

- name: Third Copyright Term Extension Act of 1967
  date: 1967-11-16
  citation: 81 Stat. 464
  public_law: Pub. L. 90-141
  summary: >
    Third interim extension of copyright renewal terms pending general revision.
  status: pending

- name: Fourth Copyright Term Extension Act of 1968
  date: 1968-07-23
  citation: 82 Stat. 397
  public_law: Pub. L. 90-416
  summary: >
    Fourth interim extension of copyright renewal terms pending general revision.
  status: pending

- name: Fifth Copyright Term Extension Act of 1969
  date: 1969-12-16
  citation: 83 Stat. 360
  public_law: Pub. L. 91-147
  summary: >
    Fifth interim extension of copyright renewal terms pending general revision.
  status: pending

- name: Sixth Copyright Term Extension Act of 1970
  date: 1970-12-17
  citation: 84 Stat. 1441
  public_law: Pub. L. 91-555
  summary: >
    Sixth interim extension of copyright renewal terms pending general revision.
  status: pending

- name: Sound Recording Amendment of 1971
  date: 1971-10-15
  citation: 85 Stat. 391
  public_law: Pub. L. 92-140
  summary: >
    Extended federal copyright protection to sound recordings fixed and first
    published on or after February 15, 1972. First time sound recordings
    received federal copyright protection.
  status: pending

- name: Seventh Copyright Term Extension Act of 1971
  date: 1971-11-24
  citation: 85 Stat. 490
  public_law: Pub. L. 92-170
  summary: >
    Seventh interim extension of copyright renewal terms pending general revision.
  status: pending

- name: Eighth Copyright Term Extension Act of 1972
  date: 1972-10-25
  citation: 86 Stat. 1181
  public_law: Pub. L. 92-566
  summary: >
    Eighth interim extension of copyright renewal terms pending general revision.
  status: pending

- name: Ninth Copyright Term Extension Act of 1974
  date: 1974-12-31
  citation: 88 Stat. 1873
  public_law: Pub. L. 93-573
  summary: >
    Ninth and final interim extension of copyright renewal terms. Also
    established the National Commission on New Technological Uses of
    Copyrighted Works (CONTU).
  status: pending

# =============================================================================
# THE 1976 ACT AND POST-1976 AMENDMENTS
# =============================================================================

- name: CONTU Amendment Act of 1976
  date: 1976-06-21
  citation: 90 Stat. 692
  public_law: Pub. L. 94-314
  summary: >
    Amended provisions related to the National Commission on New Technological
    Uses of Copyrighted Works (CONTU), which studied copyright issues
    arising from computers and photocopying technology.
  status: pending

- name: Copyright Act of 1976
  date: 1976-10-19
  effective_date: 1978-01-01
  citation: 90 Stat. 2541
  public_law: Pub. L. 94-553
  summary: >
    Complete revision of copyright law, replacing the 1909 Act. Established
    the modern structure of Title 17 U.S.C. Extended protection to life of
    the author plus 50 years. Codified fair use doctrine (Section 107).
    Preempted most state copyright law. Created compulsory licenses for
    cable retransmission and jukeboxes.
  tag: v1976
  status: pending

- name: Legislative Branch Appropriation Act of 1978 (Copyright Office Fees)
  date: 1977-08-05
  citation: 91 Stat. 653
  public_law: Pub. L. 95-94
  summary: >
    Amended Section 708 (Copyright Office fees) to direct that all fees
    received be credited to the appropriation for necessary expenses of
    the Copyright Office, effective January 1, 1978.
  status: pending

- name: CONTU Extension Act of 1977
  date: 1977-10-28
  citation: 91 Stat. 1226
  public_law: Pub. L. 95-146
  summary: >
    Extended by seven months the term of the National Commission on New
    Technological Uses of Copyrighted Works (CONTU), allowing additional
    time to complete its final report on copyright issues related to
    computer technology and machine reproduction.
  status: pending

- name: Bankruptcy Reform Act of 1978 (Copyright Provision)
  date: 1978-11-06
  citation: 92 Stat. 2676
  public_law: Pub. L. 95-598
  summary: >
    Amended Section 201(e) (copyright ownership) by inserting "except as
    provided under title 11" to clarify that transfers of copyright
    ownership could occur through bankruptcy proceedings.
  status: pending

- name: Computer Software Copyright Act of 1980
  date: 1980-12-12
  citation: 94 Stat. 3015
  public_law: Pub. L. 96-517
  summary: >
    Amended Section 101 (definitions) and added Section 117, confirming
    that computer programs are copyrightable literary works and establishing
    the right to make archival copies.
  status: pending

- name: Piracy and Counterfeiting Amendments Act of 1982
  date: 1982-05-24
  citation: 96 Stat. 91
  public_law: Pub. L. 97-180
  summary: >
    Increased penalties for piracy of sound recordings and motion pictures.
  status: pending

- name: Manufacturing Clause Extension Act of 1982
  date: 1982-07-13
  citation: 96 Stat. 178
  public_law: Pub. L. 97-215
  summary: >
    Amended Section 601 (manufacturing requirement) by extending the
    expiration date of the manufacturing clause from 1982 to July 1, 1986,
    continuing the requirement that certain literary works by US authors
    be manufactured in the United States or Canada.
  status: pending

- name: Nonprofit Performance Exemption Act of 1982
  date: 1982-10-25
  citation: 96 Stat. 1759
  public_law: Pub. L. 97-366
  summary: >
    Added Section 110(10), exempting nonprofit veterans' organizations and
    fraternal organizations from liability for public performances of
    nondramatic literary or musical works at social functions.
  status: pending

- name: Record Rental Amendment of 1984
  date: 1984-10-04
  citation: 98 Stat. 1727
  public_law: Pub. L. 98-450
  summary: >
    Prohibited commercial rental, lease, or lending of phonorecords
    without the copyright owner's permission. Added Section 109(b) exception.
  status: pending

- name: Semiconductor Chip Protection Act of 1984
  date: 1984-11-08
  citation: 98 Stat. 3347
  public_law: Pub. L. 98-620
  summary: >
    Added Chapter 9 to Title 17, creating sui generis protection for
    semiconductor chip mask works. 10-year term of protection.
  tag: v1984-chips
  status: pending

- name: Cable Compulsory License Amendments of 1986
  date: 1986-08-27
  citation: 100 Stat. 848
  public_law: Pub. L. 99-397
  summary: >
    Amended the Section 111 cable compulsory license provisions regarding
    royalty fee calculations and secondary transmission rules.
  status: pending

- name: Semiconductor Chip Protection Extension Act of 1987
  date: 1987-11-09
  citation: 101 Stat. 899
  public_law: Pub. L. 100-159
  summary: >
    Amended Sections 902 and 914 of the Semiconductor Chip Protection Act
    by extending the deadline for interim international protection orders
    and granting the President authority to revise, suspend, or revoke
    proclamations extending chip protection to foreign nationals.
  status: pending

- name: Berne Convention Implementation Act of 1988
  date: 1988-10-31
  citation: 102 Stat. 2853
  public_law: Pub. L. 100-568
  summary: >
    Amended Title 17 to comply with the Berne Convention for the Protection
    of Literary and Artistic Works. Made copyright notice optional rather
    than mandatory. Effective March 1, 1989.
  tag: v1988-berne
  status: pending

- name: Record Rental Extension Act of 1988
  date: 1988-11-05
  citation: 102 Stat. 3194
  public_law: Pub. L. 100-617
  summary: >
    Extended the Record Rental Amendment of 1984's restrictions on commercial
    rental of sound recordings (Section 109 first sale exception) by an
    additional eight years, pushing the expiration to October 4, 1997.
  status: pending

- name: Satellite Home Viewer Act of 1988
  date: 1988-11-16
  citation: 102 Stat. 3949
  public_law: Pub. L. 100-667, Title II
  summary: >
    Added Section 119 to Title 17, creating a compulsory license for
    satellite carriers to retransmit distant broadcast signals to
    unserved households. First satellite-specific copyright provision.
  status: pending

- name: Judicial Improvements and Access to Justice Act of 1988 (Copyright Provision)
  date: 1988-11-19
  citation: 102 Stat. 4672
  public_law: Pub. L. 100-702
  summary: >
    Amended Section 912 of the Semiconductor Chip Protection Act by
    striking a cross-reference subsection to Title 28 (judiciary) and
    redesignating remaining subsections.
  status: pending

- name: Copyright Royalty Tribunal Reform and Miscellaneous Pay Act of 1989
  date: 1990-07-03
  citation: 104 Stat. 290
  public_law: Pub. L. 101-319
  summary: >
    Amended Sections 701 and 802 regarding the Copyright Royalty Tribunal,
    reforming the pay structure and miscellaneous operational provisions.
  status: pending

- name: Copyright Fees and Technical Amendments Act of 1989
  date: 1990-07-03
  citation: 104 Stat. 287
  public_law: Pub. L. 101-318
  summary: >
    Updated the cross-reference in the introductory provisions of Section 106
    to reflect the addition of Section 119 (satellite compulsory license)
    by the Satellite Home Viewer Act of 1988.
  status: pending

- name: Copyright Remedy Clarification Act of 1990
  date: 1990-11-15
  citation: 104 Stat. 2749
  public_law: Pub. L. 101-553
  summary: >
    Added Section 511, making states and state entities subject to suit for
    copyright infringement (later limited by Supreme Court decisions).
  status: pending

- name: Computer Software Rental Amendments Act of 1990
  date: 1990-12-01
  citation: 104 Stat. 5089
  public_law: Pub. L. 101-650, Title VIII
  summary: >
    Extended the record rental prohibition to computer programs. Prohibited
    commercial rental of software without the copyright owner's permission.
  status: pending

- name: Visual Artists Rights Act of 1990 (VARA)
  date: 1990-12-01
  citation: 104 Stat. 5128
  public_law: Pub. L. 101-650, Title VI
  summary: >
    Added Section 106A, granting moral rights (attribution and integrity)
    to authors of works of visual art. First recognition of moral rights
    in US copyright law.
  status: pending

- name: Architectural Works Copyright Protection Act of 1990
  date: 1990-12-01
  citation: 104 Stat. 5133
  public_law: Pub. L. 101-650, Title VII
  summary: >
    Added architectural works to the categories of copyrightable subject
    matter in Section 102. Added Section 120 limiting exclusive rights
    in architectural works.
  status: pending

- name: Semiconductor International Protection Extension Act of 1991
  date: 1991-06-28
  citation: 105 Stat. 320
  public_law: Pub. L. 102-64
  summary: >
    Amended Section 914 by extending the deadline for interim international
    protection orders for semiconductor chip mask works to July 1, 1995,
    and broadening the types of foreign legal regimes qualifying for
    reciprocal protection.
  status: pending

- name: Copyright Renewal Act of 1992
  date: 1992-06-26
  citation: 106 Stat. 264
  public_law: Pub. L. 102-307
  summary: >
    Made copyright renewal automatic for works published between 1964 and 1977.
    Eliminated the requirement to file a renewal registration to maintain
    copyright protection.
  status: pending

- name: Fair Use of Unpublished Works Act of 1992
  date: 1992-10-24
  citation: 106 Stat. 3145
  public_law: Pub. L. 102-492
  summary: >
    Added a sentence to Section 107 (fair use): "The fact that a work is
    unpublished shall not itself bar a finding of fair use if such finding
    is made upon consideration of all the above factors." Overrode case law
    treating unpublished status as virtually dispositive against fair use.
  status: pending

- name: Copyright Felony Act of 1992
  date: 1992-10-28
  citation: 106 Stat. 4233
  public_law: Pub. L. 102-561
  summary: >
    Made large-scale commercial copyright infringement of sound recordings
    and audiovisual works a felony rather than a misdemeanor. Amended
    criminal penalty provisions.
  status: pending

- name: Audio Home Recording Act of 1992
  date: 1992-10-28
  citation: 106 Stat. 4237
  public_law: Pub. L. 102-563
  summary: >
    Added Chapter 10 to Title 17. Required royalty payments on digital audio
    recording devices and media. Mandated Serial Copy Management System (SCMS).
    Prohibited infringement suits based on noncommercial home recording.
  status: pending

- name: Legislative Branch Appropriations Act of 1994 (Copyright Provision)
  date: 1993-08-11
  citation: 107 Stat. 692
  public_law: Pub. L. 103-69
  summary: >
    Section 307 imposed personnel reduction requirements on legislative
    branch entities but exempted positions required for the administration
    of compulsory licensing under Section 803.
  status: pending

- name: North American Free Trade Agreement Implementation Act of 1993 (Copyright Provisions)
  date: 1993-12-08
  citation: 107 Stat. 2057
  public_law: Pub. L. 103-182
  summary: >
    Amended Section 104A to restore copyright in certain motion pictures
    from NAFTA countries.
  status: pending

- name: Copyright Royalty Tribunal Reform Act of 1993
  date: 1993-12-17
  citation: 107 Stat. 2304
  public_law: Pub. L. 103-198
  summary: >
    Abolished the Copyright Royalty Tribunal and replaced it with ad hoc
    Copyright Arbitration Royalty Panels (CARPs) administered by the
    Librarian of Congress. Amended royalty fee provisions in Sections 111,
    116, 118, and 119.
  status: pending

- name: Satellite Home Viewer Act of 1994
  date: 1994-10-18
  citation: 108 Stat. 3477
  public_law: Pub. L. 103-369
  summary: >
    Extended the Section 119 satellite compulsory license originally
    established by the Satellite Home Viewer Act of 1988.
  status: pending

- name: Uruguay Round Agreements Act of 1994 (Copyright Provisions)
  date: 1994-12-08
  citation: 108 Stat. 4809
  public_law: Pub. L. 103-465
  summary: >
    Rewrote Section 104A to restore copyright in works from WTO and Berne
    Convention countries that had entered the public domain in the US due
    to noncompliance with formalities, lack of national eligibility, or
    lack of subject matter protection.
  status: pending

- name: Digital Performance Right in Sound Recordings Act of 1995
  date: 1995-11-01
  citation: 109 Stat. 336
  public_law: Pub. L. 104-39
  summary: >
    Added a new exclusive right for copyright owners of sound recordings:
    the right to perform the work publicly by means of digital audio
    transmission. Added Section 114 provisions and Section 115 amendments.
  status: pending

- name: Anticounterfeiting Consumer Protection Act of 1996 (Copyright Provisions)
  date: 1996-07-02
  citation: 110 Stat. 1386
  public_law: Pub. L. 104-153
  summary: >
    Amended Section 603 regarding importation prohibitions on piratical
    copies of copyrighted works.
  status: pending

- name: Legislative Branch Appropriations Act of 1997 (Chafee Amendment)
  date: 1996-09-16
  citation: 110 Stat. 2416
  public_law: Pub. L. 104-197
  summary: >
    Enacted Section 121 (the "Chafee Amendment"), creating a limitation
    on exclusive rights that permits authorized entities to reproduce and
    distribute copyrighted literary works in accessible formats exclusively
    for use by blind or other persons with disabilities.
  status: pending

- name: Miscellaneous Trade and Technical Corrections Act of 1996 (Copyright Provision)
  date: 1996-10-11
  citation: 110 Stat. 3514
  public_law: Pub. L. 104-295
  summary: >
    Made a technical correction to Section 104A (copyright in restored works)
    by fixing an internal cross-reference in the copyright restoration
    provisions enacted by the Uruguay Round Agreements Act.
  status: pending

- name: Copyright Technical Amendments Act of 1997
  date: 1997-11-13
  citation: 111 Stat. 1529
  public_law: Pub. L. 105-80
  summary: >
    Made technical corrections and conforming amendments throughout Title 17.
    Corrected cross-references and clerical errors in multiple sections.
  status: pending

- name: No Electronic Theft Act of 1997 (NET Act)
  date: 1997-12-16
  citation: 111 Stat. 2678
  public_law: Pub. L. 105-147
  summary: >
    Amended Section 506 and criminal provisions to cover willful copyright
    infringement even without financial gain. Closed the "LaMacchia loophole"
    that required proof of profit motive for criminal prosecution.
  status: pending

- name: Sonny Bono Copyright Term Extension Act of 1998
  date: 1998-10-27
  citation: 112 Stat. 2827
  public_law: Pub. L. 105-298, Title I
  summary: >
    Extended copyright terms by 20 years across the board. Individual works:
    life of the author plus 70 years. Works for hire and anonymous/pseudonymous
    works: 95 years from publication or 120 years from creation.
  tag: v1998-ctea
  status: pending

- name: Fairness in Music Licensing Act of 1998
  date: 1998-10-27
  citation: 112 Stat. 2827
  public_law: Pub. L. 105-298, Title II
  summary: >
    Amended Section 110(5) to expand the exemption for public performance
    of music by small businesses (restaurants, bars, retail establishments)
    via radio and television reception.
  status: pending

- name: Digital Millennium Copyright Act of 1998 (DMCA)
  date: 1998-10-28
  citation: 112 Stat. 2860
  public_law: Pub. L. 105-304
  summary: >
    Implemented WIPO Copyright Treaty and WIPO Performances and Phonograms
    Treaty. Added Chapter 12 (Sections 1201-1205) prohibiting circumvention
    of technological protection measures. Added Section 512 safe harbor for
    online service providers. Added Section 117(c) for computer maintenance.
  tag: v1998-dmca
  status: pending

- name: Technical Corrections to Title 17 Act of 1999
  date: 1999-08-05
  citation: 113 Stat. 221
  public_law: Pub. L. 106-44
  summary: >
    Made technical corrections throughout Title 17. Renumbered the conflicting
    Section 512 ("Determination of reasonable license fees") to Section 513 to
    resolve the conflict with the DMCA's Section 512 (online service provider
    safe harbors). Fixed cross-references in Sections 106, 501, and 511.
    Corrected clerical errors in Sections 112, 119, 1202, 1302, and 1320.
  status: pending

- name: Intellectual Property and Communications Omnibus Reform Act of 1999
  date: 1999-11-29
  citation: 113 Stat. 1501
  public_law: Pub. L. 106-113
  summary: >
    Omnibus act containing multiple intellectual property provisions including
    satellite home viewer improvements, digital audio webcasting provisions,
    and technical corrections to DMCA and other copyright provisions.
  status: pending

- name: Digital Theft Deterrence and Copyright Damages Improvement Act of 1999
  date: 1999-12-09
  citation: 113 Stat. 1774
  public_law: Pub. L. 106-160
  summary: >
    Increased statutory damages for copyright infringement under Section 504(c).
    Raised the range for both ordinary and willful infringement.
  status: pending

- name: Work Made for Hire and Copyright Corrections Act of 2000
  date: 2000-10-27
  citation: 114 Stat. 1444
  public_law: Pub. L. 106-379
  summary: >
    Repealed the controversial addition of "sound recordings" to the
    work-made-for-hire categories in Section 101, which had been quietly
    added in a 1999 satellite bill. Made other technical corrections.
  status: pending

- name: Technology, Education, and Copyright Harmonization Act of 2002 (TEACH Act)
  date: 2002-11-02
  citation: 116 Stat. 1758
  public_law: Pub. L. 107-273
  summary: >
    Updated Section 110(2) to expand the copyright exemption for distance
